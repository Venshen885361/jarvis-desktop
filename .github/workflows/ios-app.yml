name: ios-app
# 在 GitHub 的 macOS runner 上把 hud/mobile.html 包成 iOS App（未簽章 IPA）。
# 下載 artifact 後用 Sideloadly（Windows 可）+ 自己的 Apple ID 簽章安裝；免費帳號 7 天要重簽。
on:
  workflow_dispatch:
  push:
    paths: ["ios-app/**", "hud/mobile.html", ".github/workflows/ios-app.yml"]

jobs:
  build:
    runs-on: macos-15
    defaults: { run: { working-directory: ios-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 安裝相依 + 同步網頁
        run: |
          npm install --no-audit --no-fund
          npm run sync-www
      - name: 產生 iOS 專案（不進 repo）
        run: |
          npx cap add ios
          python3 patch_plist.py
          npx cap sync ios
      - name: Xcode archive（不簽章）
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive | tail -40
      - name: 打包成未簽章 IPA
        run: |
          cd ios/App/build
          mkdir -p Payload && cp -R App.xcarchive/Products/Applications/JARVIS.app Payload/ 2>/dev/null || cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qr JARVIS-unsigned.ipa Payload
          ls -la JARVIS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ios-unsigned
          path: ios-app/ios/App/build/JARVIS-unsigned.ipa
