<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#0b1220">
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--panel2:#162036;--line:#1e293b;--fg:#e2e8f0;--muted:#7c8aa5;--accent:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--blue:#1d4ed8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC",sans-serif;-webkit-text-size-adjust:100%}
  button,input,textarea{font:inherit}
  input,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;line-height:1.3}
  input:focus,textarea:focus{border-color:var(--accent)}
  input::placeholder,textarea::placeholder{color:#4b5877}
  label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;line-height:1.3}
  label.f:first-child{margin-top:0}
  .hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
  a{color:var(--accent);text-decoration:none}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);padding:1px 5px;border-radius:5px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--accent);color:#0b1220;line-height:1.2}
  .btn:disabled{opacity:.5}

  /* ---------- 登入 ---------- */
  #login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% 0%,#12213f 0%,var(--bg) 60%);overflow-y:auto}
  #login[hidden]{display:none}
  .card{width:100%;max-width:400px}
  .logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;text-align:center}
  .logo svg{width:84px;height:84px;filter:drop-shadow(0 0 18px rgba(56,189,248,.35))}
  .logo h1{margin:0;font-size:22px;letter-spacing:.22em;color:var(--accent);font-weight:600}
  .logo p{margin:0;font-size:13px;color:var(--muted)}
  .field{margin-bottom:14px}
  .field .row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .field .row2 label{font-size:13px;color:var(--muted);white-space:nowrap}
  .field .row2 small{font-size:12px;color:#4b5877;text-align:right}
  .err{min-height:20px;font-size:13px;color:var(--err);margin:4px 0 10px;line-height:1.4}
  .links{display:flex;justify-content:center;gap:18px;margin-top:22px;font-size:13px}
  .links a{color:var(--muted)}

  /* ---------- 主畫面 ---------- */
  #app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
  #app[hidden]{display:none}
  header{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  main#log:empty::after{content:"還沒有對話";color:#3b4a66;font-size:13px;text-align:center}
  header h1{font-size:15px;margin:0;letter-spacing:.14em;color:var(--accent);flex:1;min-width:0;white-space:nowrap}
  header .st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36%}
  .ib{flex:none;background:none;border:0;color:var(--muted);font-size:17px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
  .ib:active{background:var(--panel2)}
  .chips{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .chips:empty{display:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;line-height:1.3;white-space:nowrap}
  .chip.dev{border-color:var(--blue);color:#93c5fd}
  .chip.dev.on{background:var(--blue);color:#fff}
  main#log{padding:8px 0;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
  .msg{max-width:86%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
  .sir{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .jarvis{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .sys{align-self:center;font-size:12px;color:var(--muted);text-align:center;max-width:92%}
  .tool{align-self:flex-start;font-size:12px;color:#93c5fd;font-family:ui-monospace,Menlo,monospace;padding:2px 10px}
  form{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
  form input{flex:1;min-width:0;padding:10px 12px}
  form .act{flex:none;height:44px;padding:0 16px;border:0;border-radius:12px;font-size:15px;font-weight:600;background:var(--accent);color:#0b1220}
  #mic{width:44px;padding:0;background:var(--panel2);color:var(--accent);border:1px solid var(--line);font-size:18px}
  #mic.rec{background:var(--err);color:#fff;border-color:var(--err)}
  #mic[hidden]{display:none}

  /* ---------- 對話框 ---------- */
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;width:min(92vw,440px);max-height:88dvh;overflow-y:auto;margin:auto}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .dhead strong{font-size:17px}
  .dhead span{font-size:12px;color:var(--warn)}
  .tabs{display:flex;gap:2px;margin:12px 0 6px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 0;font-size:13px;white-space:nowrap}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 6px;font-size:13px;line-height:1.25}
  .seg button small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .seg button.on{border-color:var(--accent);color:var(--accent)}
  .toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
  .toggle input{width:auto;accent-color:var(--accent);margin:0}
  .usage{font-size:11px;color:var(--muted);margin-top:14px;font-family:ui-monospace,Menlo,monospace}
  .row{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
  .row button{border:0;border-radius:10px;padding:9px 16px;font-size:14px;background:var(--line);color:var(--fg)}
  .row button.primary{background:var(--accent);color:#0b1220;font-weight:600}

  /* ---------- 下載 ---------- */
  .dl{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px;margin-top:10px}
  .dl .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
  .dl .tx{flex:1;min-width:0}
  .dl .tx b{display:block;font-size:14px;line-height:1.3}
  .dl .tx small{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
  .dl a.get{flex:none;background:var(--accent);color:#0b1220;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .dl a.get.ghost{background:var(--line);color:var(--fg);font-weight:500}
  .dl-note{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.6}

  /* ---------- 動畫 ---------- */
  .logo canvas{width:132px;height:132px;display:block}
  .logo .halo{position:relative}
  .logo .halo::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.28),rgba(56,189,248,0) 70%);animation:halo 3.2s ease-in-out infinite;pointer-events:none}
  @keyframes halo{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.08);opacity:1}}
  .card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  .card .field,.card .btn,.card .links{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  .card .field:nth-of-type(1){animation-delay:.08s}.card .field:nth-of-type(2){animation-delay:.14s}.card .btn{animation-delay:.2s}.card .links{animation-delay:.26s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #orb{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stage .chips{position:absolute;left:0;right:0;top:0;border:0;background:linear-gradient(var(--bg),transparent);padding-top:10px}
  #reply{flex:none;padding:6px 18px 4px;display:flex;flex-direction:column;gap:6px;min-height:78px;max-height:38dvh;overflow-y:auto}
  #reply .you{font-size:12px;color:var(--muted);text-align:right;min-height:16px;white-space:pre-wrap;word-break:break-word}
  #reply .ans{font-size:17px;line-height:1.55;color:var(--fg);white-space:pre-wrap;word-break:break-word;text-align:center}
  #reply .ans .hint{color:#3b4a66;font-size:13px}
  #reply .ans.sys{color:var(--muted);font-size:13px}
  #reply .ans .cur{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink2 .9s steps(2) infinite}
  @keyframes blink2{50%{opacity:0}}
  #reply .steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  #reply .steps span{font-size:11px;color:#93c5fd;font-family:ui-monospace,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px;animation:pop .25s both}
  #reply .typing{align-self:center;margin:2px 0}
  dialog.sheet{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:80dvh;display:none;flex-direction:column}
  dialog.sheet[open]{display:flex}
  dialog.sheet main{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:8px}
  .msg{animation:pop .28s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
  .sir{transform-origin:bottom right}.jarvis{transform-origin:bottom left}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px;animation:pop .25s both}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
  .chip{transition:transform .12s,background .15s,border-color .15s}
  .chip:active{transform:scale(.94)}
  .btn:active,form .act:active{transform:scale(.97)}
  dialog[open]{animation:dlgIn .28s cubic-bezier(.2,.8,.2,1)}
  dialog[open]::backdrop{animation:fade .25s both}
  @keyframes dlgIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #app,#login{animation:fade .35s both}
  header .st{transition:color .3s}
  header .st.busy{color:var(--warn)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ======================= 登入 ======================= -->
<section id="login">
  <div class="card">
    <div class="logo">
      <div class="halo"><canvas id="logoOrb" aria-hidden="true"></canvas></div>
      <h1>J.A.R.V.I.S.</h1>
      <p>連到你的 JARVIS 大腦</p>
    </div>
    <div class="field">
      <div class="row2"><label for="lgUrl">JARVIS 位址</label><small>留空 = 這個網頁的來源</small></div>
      <input id="lgUrl" placeholder="http://192.168.1.10:8080" inputmode="url" autocapitalize="off" autocorrect="off">
    </div>
    <div class="field">
      <div class="row2"><label for="lgTok">密語</label><small>.env 的 JARVIS_AGENT_TOKEN</small></div>
      <input id="lgTok" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="err" id="lgErr"></div>
    <button class="btn" id="lgGo">連線</button>
    <div class="links">
      <a href="#" id="lgDl">📥 下載電腦版 / Android App</a>
      <a href="https://github.com/Venshen885361/jarvis-desktop" target="_blank" rel="noopener">說明</a>
    </div>
  </div>
</section>

<!-- ======================= 主畫面 ======================= -->
<div id="app" hidden>
  <header>
    <h1>J.A.R.V.I.S.</h1>
    <span class="st" id="st">未連線</span>
    <button class="ib" id="modeBtn" aria-label="切換造型" title="球 / 人像">◎</button>
    <button class="ib" id="histBtn" aria-label="對話紀錄">☰</button>
    <button class="ib" id="dlBtn" aria-label="下載 App">📥</button>
    <button class="ib" id="gear" aria-label="設定">⚙︎</button>
  </header>
  <section id="stage">
    <canvas id="orb" aria-hidden="true"></canvas>
    <div class="chips" id="devs"></div>
  </section>
  <section id="reply">
    <div class="you" id="lastYou"></div>
    <div class="ans" id="lastAns"><span class="hint">對 JARVIS 說點什麼，或按下面的快速指令</span></div>
    <div class="steps" id="lastSteps"></div>
  </section>
  <div class="chips" id="quick"></div>
  <form id="f" autocomplete="off">
    <button type="button" class="act" id="mic" aria-label="語音輸入" hidden>🎙</button>
    <input id="q" placeholder="對 JARVIS 說…" enterkeyhint="send">
    <button type="submit" class="act" id="send">送出</button>
  </form>
</div>

<!-- ======================= 對話紀錄 ======================= -->
<dialog id="histDlg" class="sheet">
  <div class="dhead"><strong>對話紀錄</strong></div>
  <main id="log"></main>
  <div class="row"><button id="histClose">關閉</button></div>
</dialog>

<!-- ======================= 設定 / 初次設定 ======================= -->
<dialog id="dlg">
  <div class="dhead"><strong id="dlgTitle">設定</strong><span id="dlgHint"></span></div>
  <div class="tabs"><button data-t="conn" class="on">連線</button><button data-t="model">模型</button><button data-t="me">個人化</button><button data-t="home">家電</button></div>

  <section data-t="conn">
    <label class="f" for="cfgUrl">JARVIS 位址</label>
    <input id="cfgUrl" placeholder="留空 = 這個網頁的來源" inputmode="url" autocapitalize="off">
    <label class="f" for="cfgTok">密語</label>
    <input id="cfgTok" type="password" autocomplete="off">
    <div class="toggle"><input type="checkbox" id="cfgSpeak"><label for="cfgSpeak">用手機唸出回覆</label></div>
    <div class="usage" id="usage"></div>
  </section>

  <section data-t="model" hidden>
    <label class="f">模型後端</label>
    <div class="seg" id="provSeg"><button data-v="gemini" class="on">Gemini<small>有免費額度</small></button><button data-v="claude">Claude<small>電腦操作較強</small></button></div>
    <div id="keyGemini">
      <label class="f" for="envGEMINI_API_KEY">Gemini API Key　<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">去拿金鑰 ↗</a></label>
      <input id="envGEMINI_API_KEY" type="password" placeholder="AIza…" autocomplete="off">
    </div>
    <div id="keyClaude" hidden>
      <label class="f" for="envANTHROPIC_API_KEY">Anthropic API Key　<a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">去拿金鑰 ↗</a></label>
      <input id="envANTHROPIC_API_KEY" type="password" placeholder="sk-ant-…" autocomplete="off">
      <label class="f" for="envANTHROPIC_WORKSPACE_ID">Workspace ID（多工作區金鑰才需要）</label>
      <input id="envANTHROPIC_WORKSPACE_ID" placeholder="wrkspc_…" autocapitalize="off">
    </div>
    <p class="hint">金鑰只存在 JARVIS 那台機器的 .env，不會上傳到任何地方。已存的金鑰會顯示成 •••• 後四碼，留著不動就不會改。</p>
  </section>

  <section data-t="me" hidden>
    <label class="f" for="pfName">JARVIS 怎麼稱呼你</label>
    <input id="pfName" placeholder="Sir" maxlength="20">
    <label class="f">回覆長度</label>
    <div class="seg" id="pfStyle"><button data-v="concise" class="on">簡短</button><button data-v="normal">一般</button><button data-v="detailed">詳細</button></div>
    <label class="f" for="pfNotes">你的習慣（JARVIS 會記住）</label>
    <textarea id="pfNotes" rows="3" placeholder="例：我用 Firefox 不用 Chrome；冷氣叫「房間冷氣」；搜尋用 DuckDuckGo"></textarea>
    <label class="f" for="pfQuick">釘選的快速指令（逗號分隔；其餘依使用頻率自動出現）</label>
    <input id="pfQuick" placeholder="現在幾點, 用電腦開 YouTube, 關掉所有的燈">
  </section>

  <section data-t="home" hidden>
    <label class="f" for="envHA_URL">Home Assistant 位址（選填）</label>
    <input id="envHA_URL" placeholder="http://homeassistant.local:8123" inputmode="url" autocapitalize="off">
    <label class="f" for="envHA_TOKEN">長效存取權杖</label>
    <input id="envHA_TOKEN" type="password" autocomplete="off">
    <p class="hint">HA 左下角頭像 → 安全性 → 長效存取權杖。裝置在 HA 裡取中文名（客廳燈、冷氣），JARVIS 就用那個名字。</p>
  </section>

  <div class="row"><button id="cfgCancel">取消</button><button class="primary" id="cfgSave">儲存</button></div>
</dialog>

<!-- ======================= 下載 App ======================= -->
<dialog id="dlDlg">
  <div class="dhead"><strong>下載 App</strong></div>
  <div id="dlList"></div>
  <p class="dl-note" id="dlNote"></p>
  <div class="row"><button id="dlClose">關閉</button></div>
</dialog>

<script>
/* ---------- C60 線框（與桌寵 / 桌面 HUD 同一份幾何）---------- */
const C60 = (() => {
  const PHI = (1 + Math.sqrt(5)) / 2, base = [[0, 1, 3 * PHI], [1, 2 + PHI, 2 * PHI], [PHI, 2, 2 * PHI + 1]], set = new Map();
  for (const b of base) for (const sx of [1, -1]) for (const sy of [1, -1]) for (const sz of [1, -1]) {
    const p = [sx * b[0], sy * b[1], sz * b[2]];
    for (const pm of [[0, 1, 2], [1, 2, 0], [2, 0, 1]]) { const v = [p[pm[0]], p[pm[1]], p[pm[2]]]; set.set(v.map(x => x.toFixed(6)).join(','), v); }
  }
  const verts = [...set.values()], R = Math.max(...verts.map(v => Math.hypot(...v))), V = verts.map(v => v.map(x => x / R));
  const L = 2 / R, edges = [];
  for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) {
    if (Math.abs(Math.hypot(V[i][0] - V[j][0], V[i][1] - V[j][1], V[i][2] - V[j][2]) - L) < 1e-6) edges.push([i, j]);
  }
  return { V, edges, phase: V.map(() => Math.random() * Math.PI * 2) };
})();
const ORB_STYLE = {
  standby:   { rgb: [56, 189, 248], speed: 1 },
  listening: { rgb: [56, 189, 248], speed: 1.6 },
  thinking:  { rgb: [251, 191, 36], speed: 3.2 },
  speaking:  { rgb: [74, 222, 128], speed: 2.2 },
  offline:   { rgb: [100, 116, 139], speed: 0.4 },
};

/* ---------- 點構成的人像：用膠囊 / 橢圓截面在 3D 取樣表面點（y 向上，高約 2） ---------- */
function buildFigure(N) {
  const rnd = (() => { let s = 1337; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();   // 固定種子，每次長得一樣
  const pts = [];

    $('#dlList').innerHTML =
      (win ? card('🖥', 'JARVIS 電腦版（Windows）', `${win.name} · ${fmt(win.size)} · 從這台 JARVIS 直接下載`, `${cfg.url}${win.url}?token=${tok}`, '下載')
           : card('🖥', 'JARVIS 電腦版（Windows）', '桌寵 + 語音 + 操作電腦。解壓後執行 JARVIS.exe', info.releases, 'GitHub', true)) +
      (apk ? card('🤖', 'JARVIS Agent（Android）', `${apk.name} · ${fmt(apk.size)} · 讓 JARVIS 操作這支手機`, `${cfg.url}${apk.url}?token=${tok}`, '下載')
           : card('🤖', 'JARVIS Agent（Android）', '讓 JARVIS 操作 Android 手機（無障礙服務）。以 Android Studio 編譯 android/ 或等 Release', info.releases, 'GitHub', true)) +
      card('📱', 'iPhone / Android 遙控', '不用裝 App：這個網頁「加入主畫面」就是了', '#', '已在用', true);
    $('#dlNote').innerHTML = 'Android 裝 APK 要允許「安裝未知來源的應用程式」。要讓「下載」直接從這台 JARVIS 提供檔案：把 <code>JARVIS-windows.zip</code>、<code>jarvis-agent.apk</code> 放到 JARVIS 資料夾的 <code>dist/downloads/</code>。';
    dlDlg.showModal();
  }

  // ---------- 設定 / 初次設定 ----------
  const dlg = $('#dlg');
  let provider = 'gemini', style = 'concise';
  function showTab(t) {
    dlg.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    dlg.querySelectorAll('section').forEach(sec => sec.hidden = sec.dataset.t !== t);
  }
  dlg.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.t));
  $('#provSeg').querySelectorAll('button').forEach(b => b.onclick = () => setProvider(b.dataset.v));
  $('#pfStyle').querySelectorAll('button').forEach(b => b.onclick = () => { style = b.dataset.v; $('#pfStyle').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  function setProvider(v) {
    provider = v;
    $('#provSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
    $('#keyGemini').hidden = v !== 'gemini'; $('#keyClaude').hidden = v !== 'claude';
  }
  async function openSettings(firstRun) {
    $('#cfgUrl').value = localStorage.getItem('jarvis.url') || ''; $('#cfgTok').value = cfg.token; $('#cfgSpeak').checked = cfg.speak;
    $('#dlgTitle').textContent = firstRun ? '初次設定' : '設定';
    $('#dlgHint').textContent = firstRun ? '填一次金鑰與稱呼，之後不用再管' : '';
    try {
      const s = await api('/api/settings');
      for (const [k, v] of Object.entries(s.env)) { const el = document.getElementById('env' + k); if (el) el.value = v || ''; }
      setProvider(firstRun ? 'gemini' : (s.env.JARVIS_PROVIDER || 'gemini'));
      const pf = s.profile || {};
      $('#pfName').value = pf.name || 'Sir'; $('#pfNotes').value = pf.notes || ''; $('#pfQuick').value = (pf.quick || []).join(', ');
      style = pf.style || 'concise'; $('#pfStyle').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === style));
    } catch {}
    showTab(firstRun ? 'model' : 'conn');
    if (!dlg.open) dlg.showModal();
  }
  $('#gear').onclick = () => openSettings(false);
  $('#cfgCancel').onclick = () => dlg.close();
  $('#cfgSave').onclick = async () => {
    const newUrl = $('#cfgUrl').value.trim().replace(/\/$/, ''), newTok = $('#cfgTok').value.trim();
    const connChanged = newUrl !== (localStorage.getItem('jarvis.url') || '') || newTok !== cfg.token;
    localStorage.setItem('jarvis.speak', $('#cfgSpeak').checked ? '1' : '0');
    const env = { JARVIS_PROVIDER: provider };
    for (const k of ['GEMINI_API_KEY', 'ANTHROPIC_API_KEY', 'ANTHROPIC_WORKSPACE_ID', 'HA_URL', 'HA_TOKEN']) {
      const el = document.getElementById('env' + k); if (el && el.value.trim() !== '') env[k] = el.value.trim();
    }
    const profile = { name: $('#pfName').value.trim() || 'Sir', style, notes: $('#pfNotes').value.trim(),
      quick: $('#pfQuick').value.split(/[,，]/).map(x => x.trim()).filter(Boolean), onboarded: true };
    try {
      const r = await api('/api/settings', { env, profile });   // 用舊連線存，確定存到再切換
      dlg.close();
      add('sys', r.setup_needed ? '還沒有可用的模型金鑰，只能用本機功能（時間、開程式、家電）。' : '設定已儲存。');
      renderQuick(r.profile.top);
      if (connChanged) {
        localStorage.setItem('jarvis.url', newUrl); localStorage.setItem('jarvis.token', newTok);
        boot().catch(e => showLogin(e instanceof AuthError ? '密語錯誤' : '連不上 ' + cfg.url));
      }
    } catch (e) { add('sys', e instanceof AuthError ? '密語錯誤' : '儲存失敗：' + e.message); }
  };

  // ---------- 啟動 ----------
  async function boot() {
    if (!cfg.token) { showLogin(); return; }
    const s = await api('/api/status');   // 失敗會丟給呼叫端顯示
    showApp();
    renderDevices(s.devices, s.device); renderQuick(s.top); st.textContent = '已連線 · ' + s.provider; wsPort = s.ws_port || 8765;
    connectWS();
    if (s.setup_needed) openSettings(true);
  }
  boot().catch(e => showLogin(e instanceof AuthError ? '密語錯誤' : (cfg.token ? '連不上 ' + cfg.url : '')));
})();
</script>
</body>
</html>
