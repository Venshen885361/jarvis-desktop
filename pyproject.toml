[project]
name = "jarvis-desktop"
version = "0.2.0"
description = "語音控制電腦的本機 AI 總管：Anthropic computer-use / Gemini 雙後端，附 HUD 介面"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pillow>=10.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
voice = ["SpeechRecognition>=3.10", "edge-tts>=6.1", "pygame>=2.5", "PyAudio>=0.2.14"]
vision = ["opencv-python>=4.9", "mediapipe>=0.10"]
windows = ["pygetwindow>=0.0.9"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
